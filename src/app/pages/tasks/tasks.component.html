<section class="tasks-component">
  @if (!hasTasks) {
    <mat-card class="task-card" appearance="outlined">
      <mat-card-content class="task-content">
        <h2>📋 Minhas tarefas</h2>
        <p>Você ainda não tem tarefas criadas.</p>
        <p>Começe criando a sua primeira tarefa!</p>
        <button mat-flat-button (click)="cadastrarTarefa()">
          + Cadastrar minha primeira tarefa
        </button>
      </mat-card-content>
    </mat-card>
  } @else {
    @for (task of tasks(); track task.id) {
      <mat-accordion>
        <mat-expansion-panel
          (opened)="panelOpenState = true"
          (closed)="panelOpenState = false"
        >
          <mat-expansion-panel-header>
            <mat-panel-title> {{ task.nomeTarefa }} </mat-panel-title>
            <mat-panel-description>
              {{ task.dataCriacao }} {{ panelOpenState ? "open" : "closed" }}
            </mat-panel-description>
          </mat-expansion-panel-header>
          <p>{{ task.descricao }}</p>
        </mat-expansion-panel>
      </mat-accordion>
    }
    <button class="btn-nova-tarefa" mat-flat-button (click)="cadastrarTarefa()">
      + Cadastrar nova tarefa
    </button>
  }
</section>
