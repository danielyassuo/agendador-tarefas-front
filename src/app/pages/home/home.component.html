<div class="home-hero">
  <div class="hero-text">
    <h1>Organize suas tarefas de forma simples</h1>
    <p>
      Tenha mais produtividade e clareza no seu dia a dia, com o agendador de
      tarefas
    </p>
    <div class="hero-action">
      <button mat-raised-button="filled" routerLink="/register">Começe Agora</button>
      <button mat-raised-button="filled" routerLink="/login">Já tenho conta</button>
    </div>
  </div>
  <div class="hero-image">
    <img [src]="imgHero" />
  </div>
</div>
