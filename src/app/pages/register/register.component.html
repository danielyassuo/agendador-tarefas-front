<div class="register-component">
  <mat-card>
    <mat-card-header class="padding-g">
      <mat-card-title>Cadastro de Usuário</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form">
        <div class="form-cadastro">
          <mat-form-field appearance="fill" class="full-width">
            <mat-label>Nome Completo</mat-label>
            <input
              formControlName="fullname"
              placeholder="Digite seu nome completo"
              matInput
            />
            <mat-error *ngIf="form.get('fullname')?.errors?.['required']"
              >O nome completo é obrigatório</mat-error
            >
            <mat-error *ngIf="form.get('fullname')?.errors?.['minlength']"
              >Cadastre um nome com mais de 3 letras</mat-error
            >
          </mat-form-field>

          <mat-form-field appearance="fill" class="full-width">
            <mat-label>Email</mat-label>
            <input
              formControlName="email"
              placeholder="Digite seu e-mail"
              matInput
            />
            <mat-error *ngIf="form.get('email')?.errors?.['required']">O cadastro de e-mail é obrigatório</mat-error>
            <mat-error *ngIf="form.get('email')?.errors?.['email']">Este e-mail é inválido</mat-error>
          </mat-form-field>
          <input-password-field
            [control]="passwordControl"
          ></input-password-field>
        </div>
      </form>
    </mat-card-content>
    <mat-card-actions>
      <button
        mat-raised-button
        class="btn-cadastrar"
        [disabled]="form.invalid"
        (click)="submit()"
      >
        Cadastrar
      </button>
    </mat-card-actions>
  </mat-card>
</div>
