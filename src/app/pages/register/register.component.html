<div class="register-component">
  <mat-card>
    <mat-card-header class="padding-g">
      <mat-card-title>Cadastro de Usuário</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div class="form-cadastro">
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Nome Completo</mat-label>
          <input placeholder="Digite seu nome completo" matInput />
        </mat-form-field>
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Email</mat-label>
          <input placeholder="Digite seu e-mail" matInput />
        </mat-form-field>
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Senha</mat-label>
          <input type="password" placeholder="Digite sua senha" matInput />
        </mat-form-field>
      </div>
    </mat-card-content>
    <mat-card-actions>
      <button mat-raised-button class="btn-cadastrar">Cadastrar</button>
    </mat-card-actions>
  </mat-card>
</div>
