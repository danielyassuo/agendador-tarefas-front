<div class="login-component">
  <mat-card>
    <mat-card-header class="padding-g">
      <mat-card-title>Login de Usuário</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form">
        <div class="form-cadastro">
          <mat-form-field appearance="fill" class="full-width">
            <mat-label>Email</mat-label>
            <input
              formControlName="email"
              placeholder="Digite seu e-mail"
              matInput
            />

            @if (emailErrors) {
              <mat-error>{{ emailErrors }}</mat-error>
            }
          </mat-form-field>
          <!--TODO : A mensagem da senha deve ser dinâmica : Cuidar também os demais componentes-->
          <input-password-field
            [control]="passwordControl"
          ></input-password-field>
        </div>
      </form>
    </mat-card-content>
    <mat-card-actions>
      <button
        mat-raised-button
        class="btn-cadastrar"
        [disabled]="form.invalid"
        (click)="submit()"
      >
        <span class="cad-button-content">
          {{ isLoading ? "Entrando..." : "Entrar" }}

          @if (isLoading) {
            <mat-spinner diameter="20"></mat-spinner>
          }
        </span>
      </button>
    </mat-card-actions>
  </mat-card>
</div>
